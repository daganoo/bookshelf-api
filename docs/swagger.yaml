openapi: "3.0.3"
info:
  title: Bookshelf API
  description: A RESTful API for managing your personal book collection. Track books you want to read, are currently reading, or have finished.
  version: "1.0.0"
  contact:
    name: API Support

servers:
  - url: http://localhost:3000/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: "#/components/schemas/User"

    Book:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        author:
          type: string
        genre:
          type: string
          nullable: true
        status:
          type: string
          enum: [want-to-read, reading, finished]
          default: want-to-read
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        review:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BookList:
      type: object
      properties:
        count:
          type: integer
        books:
          type: array
          items:
            $ref: "#/components/schemas/Book"

    Error:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              msg:
                type: string
              path:
                type: string
              location:
                type: string

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    CreateBookRequest:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        status:
          type: string
          enum: [want-to-read, reading, finished]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string

    UpdateBookRequest:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        genre:
          type: string
        status:
          type: string
          enum: [want-to-read, reading, finished]
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string

paths:
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              name: John Doe
              email: john@example.com
              password: secret123
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIs...
                user:
                  id: 1
                  name: John Doe
                  email: john@example.com
                  created_at: "2024-01-01T00:00:00.000Z"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Email already registered
        "429":
          description: Too many requests

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: john@example.com
              password: secret123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIs...
                user:
                  id: 1
                  name: John Doe
                  email: john@example.com
                  created_at: "2024-01-01T00:00:00.000Z"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid email or password
        "429":
          description: Too many requests

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get current logged-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user data
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
              example:
                user:
                  id: 1
                  name: John Doe
                  email: john@example.com
                  created_at: "2024-01-01T00:00:00.000Z"
        "401":
          description: No token or invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: No token provided

  /books:
    get:
      tags:
        - Books
      summary: Get all books for the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by reading status
          schema:
            type: string
            enum: [want-to-read, reading, finished]
          example: reading
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookList"
              example:
                count: 2
                books:
                  - id: 1
                    user_id: 1
                    title: The Hobbit
                    author: J.R.R. Tolkien
                    genre: Fantasy
                    status: finished
                    rating: 5
                    review: A timeless classic
                    created_at: "2024-01-01T00:00:00.000Z"
                    updated_at: "2024-01-02T00:00:00.000Z"
                  - id: 2
                    user_id: 1
                    title: Dune
                    author: Frank Herbert
                    genre: Sci-Fi
                    status: reading
                    rating: 4
                    review: null
                    created_at: "2024-01-03T00:00:00.000Z"
                    updated_at: "2024-01-03T00:00:00.000Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Books
      summary: Add a new book to the collection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookRequest"
            example:
              title: The Hobbit
              author: J.R.R. Tolkien
              genre: Fantasy
              status: reading
              rating: 4
              review: Great so far
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                type: object
                properties:
                  book:
                    $ref: "#/components/schemas/Book"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: Unauthorized

  /books/{id}:
    get:
      tags:
        - Books
      summary: Get a single book by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book details
          content:
            application/json:
              schema:
                type: object
                properties:
                  book:
                    $ref: "#/components/schemas/Book"
        "401":
          description: Unauthorized
        "404":
          description: Book not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Book not found

    put:
      tags:
        - Books
      summary: Update a book
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookRequest"
            example:
              status: finished
              rating: 5
              review: Masterpiece
      responses:
        "200":
          description: Book updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  book:
                    $ref: "#/components/schemas/Book"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Book not found

    delete:
      tags:
        - Books
      summary: Delete a book
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: Book deleted
        "401":
          description: Unauthorized
        "404":
          description: Book not found

tags:
  - name: Auth
    description: User registration and authentication
  - name: Books
    description: Book collection CRUD operations
