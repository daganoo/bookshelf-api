<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="900" height="320" rx="16" fill="url(#bg2)"/>

  <text x="450" y="40" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="500" letter-spacing="2">REQUEST / RESPONSE FLOW</text>

  <!-- Step 1 -->
  <rect x="30" y="80" width="120" height="50" rx="8" fill="#4f46e5"/>
  <text x="90" y="110" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">HTTP Request</text>

  <line x1="150" y1="105" x2="185" y2="105" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Step 2 -->
  <rect x="190" y="80" width="120" height="50" rx="8" fill="#0891b2"/>
  <text x="250" y="110" text-anchor="middle" fill="#cffafe" font-size="12" font-weight="600">Middlewares</text>

  <line x1="310" y1="105" x2="345" y2="105" stroke="#22d3ee" stroke-width="1.5"/>

  <!-- Step 3 -->
  <rect x="350" y="80" width="120" height="50" rx="8" fill="#059669"/>
  <text x="410" y="110" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="600">Rate Limiter</text>

  <line x1="470" y1="105" x2="505" y2="105" stroke="#34d399" stroke-width="1.5"/>

  <!-- Step 4 -->
  <rect x="510" y="70" width="140" height="70" rx="8" fill="#ea580c"/>
  <text x="580" y="98" text-anchor="middle" fill="#fed7aa" font-size="12" font-weight="600">Auth Middleware</text>
  <text x="580" y="116" text-anchor="middle" fill="#fdba74" font-size="10">JWT Verification</text>

  <line x1="650" y1="105" x2="685" y2="105" stroke="#f97316" stroke-width="1.5"/>

  <!-- Step 5 -->
  <rect x="690" y="80" width="120" height="50" rx="8" fill="#7c3aed"/>
  <text x="750" y="110" text-anchor="middle" fill="#ede9fe" font-size="12" font-weight="600">Controller</text>

  <!-- Decision diamond -->
  <rect x="280" y="170" width="100" height="40" rx="6" fill="#4338ca"/>
  <text x="330" y="195" text-anchor="middle" fill="#c7d2fe" font-size="11" font-weight="600">Valid?</text>

  <line x1="330" y1="210" x2="330" y2="230" stroke="#818cf8" stroke-width="1.5"/>

  <!-- Valid path -->
  <rect x="255" y="235" width="150" height="45" rx="8" fill="#10b981"/>
  <text x="330" y="263" text-anchor="middle" fill="#d1fae5" font-size="12" font-weight="600">200/201 Response</text>

  <line x1="330" y1="170" x2="330" y2="160" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4"/>

  <!-- Invalid path -->
  <rect x="140" y="145" width="110" height="35" rx="6" fill="#dc2626"/>
  <text x="195" y="168" text-anchor="middle" fill="#fee2e2" font-size="11" font-weight="600">401 / 403 / 404</text>

  <!-- Error handler -->
  <rect x="360" y="145" width="110" height="35" rx="6" fill="#d97706"/>
  <text x="415" y="168" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="600">Error Handler</text>
  <line x1="380" y1="105" x2="365" y2="168" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3"/>
  <line x1="470" y1="168" x2="500" y2="168" stroke="#fbbf24" stroke-width="1.5"/>

  <rect x="505" y="145" width="110" height="35" rx="6" fill="#b45309"/>
  <text x="560" y="168" text-anchor="middle" fill="#fef3c7" font-size="11" font-weight="600">500 Response</text>
</svg>
