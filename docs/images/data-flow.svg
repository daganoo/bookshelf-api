<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="900" height="420" rx="16" fill="url(#bg3)"/>

  <text x="450" y="42" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="500" letter-spacing="2">DATA FLOW DIAGRAM</text>

  <!-- Auth Flow -->
  <text x="200" y="78" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">Authentication Flow</text>
  <rect x="50" y="95" width="130" height="45" rx="8" fill="#4f46e5"/>
  <text x="115" y="123" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">Register</text>
  <line x1="180" y1="117" x2="210" y2="117" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="215" y="95" width="120" height="45" rx="8" fill="#0891b2"/>
  <text x="275" y="117" text-anchor="middle" fill="#cffafe" font-size="11">bcryptjs Hash</text>
  <text x="275" y="132" text-anchor="middle" fill="#67e8f9" font-size="9">10 salt rounds</text>
  <line x1="335" y1="117" x2="365" y2="117" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="370" y="95" width="120" height="45" rx="8" fill="#ea580c"/>
  <text x="430" y="117" text-anchor="middle" fill="#fed7aa" font-size="11">INSERT users</text>
  <text x="430" y="132" text-anchor="middle" fill="#fdba74" font-size="9">RETURNING id,name,email</text>
  <line x1="490" y1="117" x2="520" y2="117" stroke="#f97316" stroke-width="1.5"/>
  <rect x="525" y="95" width="130" height="45" rx="8" fill="#7c3aed"/>
  <text x="590" y="117" text-anchor="middle" fill="#ede9fe" font-size="11">JWT Sign</text>
  <text x="590" y="132" text-anchor="middle" fill="#c4b5fd" font-size="9">{ id, email } · exp</text>

  <!-- Login Flow -->
  <rect x="50" y="165" width="130" height="45" rx="8" fill="#4f46e5"/>
  <text x="115" y="193" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">Login</text>
  <line x1="180" y1="187" x2="210" y2="187" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="215" y="165" width="120" height="45" rx="8" fill="#0891b2"/>
  <text x="275" y="187" text-anchor="middle" fill="#cffafe" font-size="11">SELECT * users</text>
  <text x="275" y="202" text-anchor="middle" fill="#67e8f9" font-size="9">WHERE email = $1</text>
  <line x1="335" y1="187" x2="365" y2="187" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="370" y="165" width="120" height="45" rx="8" fill="#0d9488"/>
  <text x="430" y="187" text-anchor="middle" fill="#ccfbf1" font-size="11">bcrypt Compare</text>
  <text x="430" y="202" text-anchor="middle" fill="#5eead4" font-size="9">plain vs hash</text>
  <line x1="490" y1="187" x2="520" y2="187" stroke="#2dd4bf" stroke-width="1.5"/>
  <rect x="525" y="165" width="130" height="45" rx="8" fill="#7c3aed"/>
  <text x="590" y="187" text-anchor="middle" fill="#ede9fe" font-size="11">JWT Sign</text>
  <text x="590" y="202" text-anchor="middle" fill="#c4b5fd" font-size="9">{ id, email } · exp</text>

  <!-- CRUD Flow -->
  <text x="200" y="248" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">CRUD Flow (Authenticated)</text>
  <rect x="50" y="265" width="130" height="40" rx="8" fill="#7c3aed"/>
  <text x="115" y="290" text-anchor="middle" fill="#e0e7ff" font-size="12" font-weight="600">JWT in Header</text>
  <line x1="180" y1="285" x2="210" y2="285" stroke="#a78bfa" stroke-width="1.5"/>
  <rect x="215" y="265" width="120" height="40" rx="8" fill="#b45309"/>
  <text x="275" y="290" text-anchor="middle" fill="#fef3c7" font-size="11">Auth Middleware</text>
  <line x1="335" y1="285" x2="365" y2="285" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="370" y="265" width="120" height="40" rx="8" fill="#059669"/>
  <text x="430" y="290" text-anchor="middle" fill="#d1fae5" font-size="11">Controller</text>
  <line x1="490" y1="285" x2="520" y2="285" stroke="#10b981" stroke-width="1.5"/>
  <rect x="525" y="265" width="130" height="40" rx="8" fill="#ea580c"/>
  <text x="590" y="290" text-anchor="middle" fill="#fed7aa" font-size="11">pg Pool Query</text>

  <!-- Dashboard Data -->
  <rect x="50" y="325" width="130" height="40" rx="8" fill="#4f46e5"/>
  <text x="115" y="350" text-anchor="middle" fill="#e0e7ff" font-size="11">Dashboard Load</text>
  <line x1="180" y1="345" x2="210" y2="345" stroke="#818cf8" stroke-width="1.5"/>
  <rect x="215" y="325" width="120" height="40" rx="8" fill="#0891b2"/>
  <text x="275" y="350" text-anchor="middle" fill="#cffafe" font-size="11">GET /api/books</text>
  <line x1="335" y1="345" x2="365" y2="345" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="370" y="325" width="120" height="40" rx="8" fill="#ea580c"/>
  <text x="430" y="350" text-anchor="middle" fill="#fed7aa" font-size="11">SELECT * books</text>
  <text x="430" y="360" text-anchor="middle" fill="#fdba74" font-size="8">WHERE user_id=$1 · ORDER BY</text>
  <line x1="490" y1="345" x2="520" y2="345" stroke="#f97316" stroke-width="1.5"/>
  <rect x="525" y="325" width="130" height="40" rx="8" fill="#7c3aed"/>
  <text x="590" y="350" text-anchor="middle" fill="#ede9fe" font-size="11">Render Book Cards</text>
</svg>
