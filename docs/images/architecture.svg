<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="db" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="16" fill="url(#bg)"/>

  <text x="450" y="42" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="500" letter-spacing="2">ARCHITECTURE DIAGRAM</text>

  <!-- Client Box -->
  <rect x="50" y="80" width="220" height="360" rx="12" fill="url(#client)" filter="url(#shadow)"/>
  <text x="160" y="115" text-anchor="middle" fill="#e0e7ff" font-size="16" font-weight="700">🖥️ React Frontend</text>
  <line x1="80" y1="132" x2="240" y2="132" stroke="#a5b4fc" stroke-opacity="0.4"/>
  <text x="160" y="160" text-anchor="middle" fill="#c7d2fe" font-size="12">Pages</text>
  <text x="160" y="180" text-anchor="middle" fill="#93c5fd" font-size="11">Login · Register · Dashboard</text>
  <text x="160" y="198" text-anchor="middle" fill="#93c5fd" font-size="11">AddBook · BookDetail</text>
  <text x="160" y="228" text-anchor="middle" fill="#c7d2fe" font-size="12">Components</text>
  <text x="160" y="248" text-anchor="middle" fill="#93c5fd" font-size="11">ProtectedRoute · Navbar</text>
  <text x="160" y="278" text-anchor="middle" fill="#c7d2fe" font-size="12">State</text>
  <text x="160" y="298" text-anchor="middle" fill="#93c5fd" font-size="11">AuthContext</text>
  <text x="160" y="328" text-anchor="middle" fill="#c7d2fe" font-size="12">Data Layer</text>
  <text x="160" y="348" text-anchor="middle" fill="#93c5fd" font-size="11">Axios + Interceptors</text>
  <text x="160" y="378" text-anchor="middle" fill="#c7d2fe" font-size="12">Storage</text>
  <text x="160" y="398" text-anchor="middle" fill="#93c5fd" font-size="11">localStorage (JWT)</text>

  <!-- Arrow Client → API -->
  <line x1="270" y1="260" x2="340" y2="260" stroke="#a5b4fc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="305" y="250" text-anchor="middle" fill="#818cf8" font-size="10">HTTP</text>
  <text x="305" y="278" text-anchor="middle" fill="#6366f1" font-size="9">Bearer JWT</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a5b4fc"/>
    </marker>
  </defs>

  <!-- API Box -->
  <rect x="345" y="80" width="220" height="360" rx="12" fill="url(#api)" filter="url(#shadow)"/>
  <text x="455" y="115" text-anchor="middle" fill="#ccfbf1" font-size="16" font-weight="700">⚙️ Express API</text>
  <line x1="375" y1="132" x2="535" y2="132" stroke="#5eead4" stroke-opacity="0.4"/>
  <text x="455" y="160" text-anchor="middle" fill="#99f6e4" font-size="12">Middleware Stack</text>
  <text x="455" y="180" text-anchor="middle" fill="#5eead4" font-size="11">Morgan · Helmet · CORS</text>
  <text x="455" y="198" text-anchor="middle" fill="#5eead4" font-size="11">Rate Limiter · JSON Parser</text>
  <text x="455" y="228" text-anchor="middle" fill="#99f6e4" font-size="12">Auth (3 endpoints)</text>
  <text x="455" y="248" text-anchor="middle" fill="#5eead4" font-size="11">POST register · POST login · GET me</text>
  <text x="455" y="278" text-anchor="middle" fill="#99f6e4" font-size="12">Books (5 endpoints)</text>
  <text x="455" y="298" text-anchor="middle" fill="#5eead4" font-size="11">GET all · GET :id · POST · PUT · DELETE</text>
  <text x="455" y="328" text-anchor="middle" fill="#99f6e4" font-size="12">Security</text>
  <text x="455" y="348" text-anchor="middle" fill="#5eead4" font-size="11">JWT · bcryptjs · express-validator</text>
  <text x="455" y="378" text-anchor="middle" fill="#99f6e4" font-size="12">Docs</text>
  <text x="455" y="398" text-anchor="middle" fill="#5eead4" font-size="11">Swagger UI · Postman Collection</text>

  <!-- Arrow API → DB -->
  <line x1="565" y1="260" x2="635" y2="260" stroke="#6ee7b7" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="600" y="250" text-anchor="middle" fill="#34d399" font-size="10">SQL</text>
  <text x="600" y="278" text-anchor="middle" fill="#10b981" font-size="9">pg Pool</text>
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6ee7b7"/>
    </marker>
  </defs>

  <!-- DB Box -->
  <rect x="640" y="80" width="210" height="360" rx="12" fill="url(#db)" filter="url(#shadow)"/>
  <text x="745" y="115" text-anchor="middle" fill="#fed7aa" font-size="16" font-weight="700">🗄️ PostgreSQL</text>
  <line x1="670" y1="132" x2="820" y2="132" stroke="#fdba74" stroke-opacity="0.4"/>
  <text x="745" y="190" text-anchor="middle" fill="#fed7aa" font-size="13" font-weight="600">users</text>
  <rect x="680" y="202" width="130" height="70" rx="6" fill="#7c2d12" stroke="#ea580c" stroke-width="1" opacity="0.6"/>
  <text x="745" y="222" text-anchor="middle" fill="#fdba74" font-size="10">id · name · email</text>
  <text x="745" y="238" text-anchor="middle" fill="#fdba74" font-size="10">password · created_at</text>
  <text x="745" y="258" text-anchor="middle" fill="#fed7aa" font-size="9">UNIQUE(email) · PK(id)</text>

  <text x="745" y="310" text-anchor="middle" fill="#fed7aa" font-size="13" font-weight="600">books</text>
  <rect x="680" y="322" width="130" height="85" rx="6" fill="#7c2d12" stroke="#ea580c" stroke-width="1" opacity="0.6"/>
  <text x="745" y="342" text-anchor="middle" fill="#fdba74" font-size="10">id · user_id · title · author</text>
  <text x="745" y="358" text-anchor="middle" fill="#fdba74" font-size="10">genre · status · rating · review</text>
  <text x="745" y="374" text-anchor="middle" fill="#fdba74" font-size="10">created_at · updated_at</text>
  <text x="745" y="394" text-anchor="middle" fill="#fed7aa" font-size="9">FK(user_id) · CHECK(status, rating)</text>

  <!-- Footer -->
  <text x="450" y="500" text-anchor="middle" fill="#6366f1" font-size="11" opacity="0.7">BookShelf — Full-Stack Application Architecture</text>
</svg>
